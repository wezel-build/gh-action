name: 'Wezel'
description: 'Run an exact Fiflok-assigned experiment and report its results'
branding:
  icon: 'activity'
  color: 'orange'

inputs:
  command:
    description: >-
      What to do: "run" (default) executes the explicitly assigned run;
      "lint" validates the committed experiment config — input schemas, patch
      applicability, and summaries — without touching the run queue. Use "lint"
      on `pull_request` to gate `.wezel/` changes before merge.
    required: false
    default: 'run'
  token:
    description: >-
      Fiflok runner-scoped token. Store it as a repository
      secret. Required for command "run"; unused by "lint".
    required: false
  run-id:
    description: 'Exact Fiflok run ID assigned by workflow_dispatch. Required for command "run".'
    required: false
  experiment-name:
    description: 'Exact experiment assigned by workflow_dispatch. Required for command "run".'
    required: false
  api-url:
    description: 'Fiflok API base URL.'
    required: false
    default: 'https://api.wezel.build'
  project-dir:
    description: 'Directory containing the project''s .wezel/ config.'
    required: false
    default: '.'
  wezel-version:
    description: 'Exact Wezel release to install. Defaults to the version tested with this Action release.'
    required: false
    default: 'v0.1.5-pre-pre.20260916103109+5a021a6'
  github-token:
    description: 'Token used to download Wezel releases.'
    required: false
    default: ${{ github.token }}

outputs:
  status:
    description: 'Run status — "complete" or "failed".'
  run-id:
    description: 'The assigned run ID.'

runs:
  using: 'node24'
  main: 'dist/index.js'
